  <path class="e" d="M105,170 L80,300"/>
  <path class="e" d="M295,170 L230,300"/>
  <path class="e" d="M295,170 L380,300"/>
  <path class="e" d="M295,170 L550,300"/>
  <path class="e" d="M295,170 L420,340"/>
  <path class="e" d="M470,170 L735,300"/>
  <path class="e" d="M470,170 L95,340"/>
  <path class="e" d="M645,170 L260,340"/>
  <path class="e" d="M90,230 L745,340"/>
  <path class="e" d="M602,230 L585,340"/>
