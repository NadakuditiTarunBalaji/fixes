  <path class="e" d="M355,40 L470,140"/>
  <path class="e" d="M495,40 L645,140"/>
  <path class="e" d="M625,40 L90,200"/>
  <path class="e" d="M770,40 L255,200"/>
  <path class="e" d="M90,80 L417,200"/>
  <path class="e" d="M260,80 L602,200"/>

