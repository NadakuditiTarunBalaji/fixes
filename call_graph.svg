  <rect class="n n-hlp" x="650" y="300" width="170" height="28"/><text class="t" x="735" y="318" text-anchor="middle">expandThroughDelays</text>
  <rect class="n n-hlp" x="10" y="340" width="170" height="28"/><text class="t" x="95" y="358" text-anchor="middle">isBackwardConnection</text>
  <rect class="n n-hlp" x="190" y="340" width="140" height="28"/><text class="t" x="260" y="358" text-anchor="middle">isCollision</text>
  <rect class="n n-hlp" x="340" y="340" width="160" height="28"/><text class="t" x="420" y="358" text-anchor="middle">makeUniqueBlockName</text>
  <rect class="n n-hlp" x="510" y="340" width="150" height="28"/><text class="t" x="585" y="358" text-anchor="middle">ensureSignalObject</text>
  <rect class="n n-hlp" x="670" y="340" width="150" height="28"/><text class="t" x="745" y="358" text-anchor="middle">runExtraction</text>

  <!-- GUI → Engine edges -->
  <path class="e" d="M75,40 L105,140"/>
  <path class="e" d="M75,40 L295,140"/>
