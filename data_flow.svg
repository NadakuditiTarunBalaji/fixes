<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><path d="M0,0 L7,2.5 L0,5" fill="#475569"/></marker>
    <style>
      .b{rx:5;ry:5;stroke-width:1.2}
      .input{fill:#DBEAFE;stroke:#60A5FA}
      .proc{fill:#EFF6FF;stroke:#93C5FD}
      .output{fill:#D1FAE5;stroke:#34D399}
      .data{fill:#FEF3C7;stroke:#FCD34D}
      .lbl{font-weight:600;fill:#1E293B}
      .dlbl{font-size:10px;fill:#64748B;font-style:italic}
      .fl{stroke:#475569;stroke-width:1.2;fill:none;marker-end:url(#a)}
      .sep{stroke:#E2E8F0;stroke-width:1;stroke-dasharray:4,3}
    </style>
  </defs>

  <!-- Pipeline labels -->
  <text x="15" y="22" style="font-weight:700;fill:#1E3A5F;font-size:13px">Pipeline 1: Build Parent Model</text>
  <line class="sep" x1="0" y1="195" x2="900" y2="195"/>
  <text x="15" y="215" style="font-weight:700;fill:#1E3A5F;font-size:13px">Pipeline 2: Unit Delays</text>
  <line class="sep" x1="0" y1="370" x2="900" y2="370"/>
  <text x="15" y="390" style="font-weight:700;fill:#1E3A5F;font-size:13px">Pipeline 3: Extract Attributes</text>

  <!-- PIPELINE 1 -->
  <rect class="b input" x="15" y="40" width="120" height="36"/><text class="lbl" x="75" y="63" text-anchor="middle">User Folder</text>
  <rect class="b proc" x="160" y="40" width="140" height="36"/><text class="lbl" x="230" y="63" text-anchor="middle">discoverModelFiles</text>
  <rect class="b data" x="325" y="40" width="130" height="36"/><text class="lbl" x="390" y="58" text-anchor="middle">AvailableNames</text><text class="dlbl" x="390" y="70" text-anchor="middle">cell array</text>
  <path class="fl" d="M135,58 L160,58"/>
  <path class="fl" d="M300,58 L325,58"/>

  <rect class="b input" x="15" y="95" width="140" height="36"/><text class="lbl" x="85" y="118" text-anchor="middle">selectedList.Items</text>
  <rect class="b proc" x="180" y="95" width="195" height="36"/><text class="lbl" x="277" y="118" text-anchor="middle">validateModelCompatibility</text>
  <rect class="b data" x="400" y="95" width="120" height="36"/><text class="lbl" x="460" y="113" text-anchor="middle">report struct</text><text class="dlbl" x="460" y="125" text-anchor="middle">issues, GCD step</text>
  <path class="fl" d="M155,113 L180,113"/>
  <path class="fl" d="M375,113 L400,113"/>

  <rect class="b proc" x="545" y="95" width="170" height="36"/><text class="lbl" x="630" y="118" text-anchor="middle">buildParentModelCore</text>
  <rect class="b output" x="740" y="95" width="140" height="36"/><text class="lbl" x="810" y="113" text-anchor="middle">.slx parent model</text><text class="dlbl" x="810" y="125" text-anchor="middle">file on disk</text>
  <path class="fl" d="M520,113 L545,113"/>
  <path class="fl" d="M715,113 L740,113"/>

  <rect class="b proc" x="545" y="150" width="170" height="30"/><text class="lbl" x="630" y="170" text-anchor="middle">configureSubsystemSignals</text>
  <rect class="b output" x="740" y="150" width="140" height="30"/><text class="lbl" x="810" y="170" text-anchor="middle">Signal objects</text>
  <path class="fl" d="M715,165 L740,165"/>

  <!-- PIPELINE 2 -->
  <rect class="b input" x="15" y="235" width="130" height="36"/><text class="lbl" x="80" y="258" text-anchor="middle">Model name</text>
  <rect class="b proc" x="170" y="235" width="165" height="36"/><text class="lbl" x="252" y="258" text-anchor="middle">listModelConnections</text>
  <rect class="b data" x="360" y="235" width="160" height="36"/><text class="lbl" x="440" y="253" text-anchor="middle">connections[]</text><text class="dlbl" x="440" y="265" text-anchor="middle">struct array</text>
  <path class="fl" d="M145,253 L170,253"/>
  <path class="fl" d="M335,253 L360,253"/>

  <rect class="b input" x="360" y="295" width="160" height="30"/><text class="lbl" x="440" y="315" text-anchor="middle">User picks connection</text>
  <rect class="b proc" x="545" y="295" width="180" height="30"/><text class="lbl" x="635" y="315" text-anchor="middle">insertUnitDelayOnBranch</text>
  <rect class="b output" x="750" y="295" width="130" height="30"/><text class="lbl" x="815" y="315" text-anchor="middle">Delay block added</text>
  <path class="fl" d="M520,310 L545,310"/>
  <path class="fl" d="M725,310 L750,310"/>

  <!-- PIPELINE 3 -->
  <rect class="b input" x="15" y="410" width="140" height="36"/><text class="lbl" x="85" y="433" text-anchor="middle">Subsystem handle</text>
  <rect class="b proc" x="180" y="410" width="150" height="36"/><text class="lbl" x="255" y="433" text-anchor="middle">getSubsystemPorts</text>
  <rect class="b data" x="355" y="410" width="120" height="36"/><text class="lbl" x="415" y="428" text-anchor="middle">port names</text><text class="dlbl" x="415" y="440" text-anchor="middle">cell arrays</text>
  <path class="fl" d="M155,428 L180,428"/>
  <path class="fl" d="M330,428 L355,428"/>

  <rect class="b proc" x="500" y="410" width="170" height="36"/><text class="lbl" x="585" y="433" text-anchor="middle">extractAttributesCore</text>
  <rect class="b output" x="695" y="410" width="140" height="36"/><text class="lbl" x="765" y="428" text-anchor="middle">output .m file</text><text class="dlbl" x="765" y="440" text-anchor="middle">attribute script</text>
  <path class="fl" d="M475,428 L500,428"/>
  <path class="fl" d="M670,428 L695,428"/>

  <rect class="b proc" x="500" y="470" width="170" height="30"/><text class="lbl" x="585" y="490" text-anchor="middle">replaceStorageClass</text>
  <rect class="b output" x="695" y="470" width="140" height="30"/><text class="lbl" x="765" y="490" text-anchor="middle">modified .m file</text>
  <path class="fl" d="M670,485 L695,485"/>
  <path class="fl" d="M765,446 L765,470"/>

  <rect class="b proc" x="500" y="525" width="170" height="36"/><text class="lbl" x="585" y="548" text-anchor="middle">convert_m_to_sldd</text>
  <rect class="b output" x="695" y="525" width="140" height="36"/><text class="lbl" x="765" y="543" text-anchor="middle">3x .sldd files</text><text class="dlbl" x="765" y="555" text-anchor="middle">linked to model</text>
  <path class="fl" d="M670,543 L695,543"/>
  <path class="fl" d="M765,500 L765,525"/>
</svg>